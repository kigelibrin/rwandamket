<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rwandamket | Admin Login</title>
    <link rel="icon" href="image.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #00A859; --primary-dark: #007A40; --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2a2e42; --text: #f0f0f0; --text-muted: #8a8fa8; --error: #ff4d4d; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-wrapper { width: 100%; max-width: 400px; }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand img { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 10px; }
        .brand-name { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: var(--primary); }
        .brand-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
        .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px; }
        .login-card h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
        .login-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
        input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
        .btn-login:hover { background: var(--primary-dark); }
        .btn-login:disabled { background: #444; cursor: not-allowed; }
        .error-msg { background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3); color: var(--error); padding: 11px 15px; border-radius: 10px; font-size: 0.82rem; margin-bottom: 16px; display: none; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="brand">
        <img src="image.png" alt="Rwandamket">
        <div class="brand-name">RWANDAMKET</div>
        <div class="brand-sub">Admin Console</div>
    </div>

    <div class="login-card">
        <h1>Admin Sign In</h1>
        <p>Restricted access — Rwandamket team only.</p>

        <div class="error-msg" id="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="login-btn">Sign In →</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const loginForm = document.getElementById('login-form');
const loginBtn = document.getElementById('login-btn');
const errorMsg = document.getElementById('error-msg');

function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }
function hideError() { errorMsg.style.display = 'none'; }

loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    try {
        const { data, error } = await window._supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const { data: admin, error: adminError } = await window._supabase
            .from('admin_users')
            .select('id, full_name')
            .eq('user_id', data.user.id)
            .single();

        if (adminError || !admin) {
            await window._supabase.auth.signOut();
            throw new Error('This account does not have admin access.');
        }

        window.location.replace('admin-dashboard.html');

    } catch (err) {
        showError(err.message || 'Login failed.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In →';
    }
});

window._supabase?.auth.getSession().then(async function(result) {
    const session = result.data.session;
    if (!session) return;

    const { data: admin } = await window._supabase
        .from('admin_users')
        .select('id')
        .eq('user_id', session.user.id)
        .single();

    if (admin) window.location.replace('admin-dashboard.html');
});
</script>
</body>
</html>
